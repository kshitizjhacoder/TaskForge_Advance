# ---------------------------------------------------------------------------
# TaskForge base configuration.
# Every secret comes from an environment variable; nothing sensitive lives here.
# Profile-specific overrides: application-dev.yml, application-prod.yml.
# ---------------------------------------------------------------------------
spring:
  application:
    name: taskforge
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskforge?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:taskforge}
    password: ${DB_PASSWORD:}

  jpa:
    # Never hold a DB connection open while rendering the HTTP response
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Store java.time.Instant in DATETIME(6) columns (always UTC)
          preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    cache-names: master-data

  ai:
    model:
      # Which AI provider to use: google-genai (real Gemini), fake (canned answers for dev/tests)
      # or none (AI features switched off). The same value selects TaskForge's AI adapter.
      chat: ${AI_PROVIDER:none}
    chat:
      client:
        # TaskForge builds its own ChatClient only when Gemini is enabled
        enabled: false
    google:
      genai:
        # Free key from Google AI Studio (create it WITHOUT billing so it can never charge you)
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}
            temperature: 0.3
    retry:
      # One retry for temporary errors (e.g. HTTP 503 from Gemini), then give up
      max-attempts: 2

  servlet:
    multipart:
      # Hard limits for uploads; must be at least taskforge.attachments.max-file-size
      max-file-size: 10MB
      max-request-size: 11MB

taskforge:
  security:
    jwt:
      # HMAC-SHA256 signing key, at least 32 characters. Required; never commit a real one.
      secret: ${JWT_SECRET:}
      issuer: taskforge
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    cors:
      # Comma-separated list of frontend URLs allowed to call the API from a browser
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    rate-limit:
      # Max login/register attempts per client IP per minute
      auth-requests-per-minute: 10
    bootstrap-admin:
      # If no ADMIN exists at startup and both values are set, this admin is created
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      full-name: ${ADMIN_FULL_NAME:TaskForge Admin}

  storage:
    s3:
      # S3-compatible endpoint: MinIO locally (http://localhost:9000), Cloudflare R2 or AWS S3 when deployed.
      # Leave empty to use the AWS default endpoint for the region.
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET:taskforge-attachments}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      # MinIO needs path-style URLs (http://host/bucket/key)
      path-style-access: ${S3_PATH_STYLE:true}
      # Create the bucket at startup if it doesn't exist (handy for local MinIO)
      create-bucket-if-missing: ${S3_CREATE_BUCKET:false}

  attachments:
    # Larger uploads are rejected with 413 (see spring.servlet.multipart below)
    max-file-size: 10MB
    allowed-content-types:
      - image/png
      - image/jpeg
      - image/gif
      - image/webp
      - application/pdf
      - text/plain
      - text/csv
      - application/zip
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-powerpoint
      - application/vnd.openxmlformats-officedocument.presentationml.presentation

  ai:
    # Daily limits (UTC days). Keep the global limit below the Gemini free-tier daily quota.
    user-daily-limit: 10
    global-daily-limit: 200
    # Give up waiting for the model after this long
    timeout: 25s
    # Most subtasks the AI may suggest for one task
    max-suggestions: 8

server:
  port: ${PORT:8080}
  error:
    # Never leak stack traces or exception messages in error responses
    include-stacktrace: never
    include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
