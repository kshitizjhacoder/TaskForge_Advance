# Local development overrides: verbose logging for our code and SQL statements.
logging:
  level:
    com.kshitiz.taskforge: DEBUG
    org.hibernate.SQL: DEBUG

# Database started by docker-compose.yml (local-only credentials)
spring:
  datasource:
    username: ${DB_USERNAME:taskforge}
    password: ${DB_PASSWORD:taskforge}

# Development-only defaults so the app starts without extra setup.
# These values are public; NEVER use them outside a local machine.
taskforge:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-not-for-production-0123456789}
    bootstrap-admin:
      email: ${ADMIN_EMAIL:admin@taskforge.local}
      password: ${ADMIN_PASSWORD:admin12345}
  # Local MinIO started by docker-compose.yml (credentials are public dev defaults)
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:taskforge}
      secret-key: ${S3_SECRET_KEY:taskforge-dev-secret}
      create-bucket-if-missing: true
