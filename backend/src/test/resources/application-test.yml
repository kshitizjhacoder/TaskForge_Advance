# Settings used by tests (profile "test"). Values here are test-only and public.
# Tests never call the real Gemini API.
spring:
  ai:
    model:
      chat: fake

taskforge:
  security:
    jwt:
      secret: test-only-secret-not-for-production-0123456789
    rate-limit:
      auth-requests-per-minute: 1000
    bootstrap-admin:
      email: admin@test.dev
      password: admin12345
  ai:
    # Small limit so the integration test can reach it
    user-daily-limit: 3
    global-daily-limit: 1000
